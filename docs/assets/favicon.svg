<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="orkit">
  <title>orkit</title>
  <style>
    .ink { stroke: #3F51B5; fill: none } .ink-fill { fill: #3F51B5 }
    .accent { stroke: #009688; fill: none } .accent-fill { fill: #009688 }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #8C9EFF } .ink-fill { fill: #8C9EFF }
      .accent { stroke: #4DB6AC } .accent-fill { fill: #4DB6AC }
    }
  </style>
  <!-- A closed route: a ring with three stops; the highlighted leg leaves the teal stop. -->
  <mask id="orkit-stops">
      <rect x="-8" y="-8" width="80" height="80" fill="white"/>
      <circle cx="48.85" cy="17.86" r="10.0" fill="black"/>
      <circle cx="35.82" cy="53.67" r="10.0" fill="black"/>
      <circle cx="11.33" cy="24.48" r="10.0" fill="black"/>
  </mask>
  <g mask="url(#orkit-stops)" stroke-width="9">
    <circle class="ink" cx="32" cy="32" r="22"/>
    <path class="accent" d="M48.85 17.86A22 22 0 0 1 35.82 53.67"/>
  </g>
  <circle class="accent-fill" cx="48.85" cy="17.86" r="7.5"/>
  <circle class="ink-fill" cx="35.82" cy="53.67" r="7.5"/>
  <circle class="ink-fill" cx="11.33" cy="24.48" r="7.5"/>
</svg>
