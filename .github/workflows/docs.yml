name: Docs

# Rebuilds the documentation site (MkDocs guide + Javadoc) and publishes it to the gh-pages
# branch, which GitHub Pages serves at https://janglada.github.io/orkit/.
on:
  push:
    branches: [master]
    paths:
      - docs/**
      - mkdocs.yml
      - CHANGELOG.md
      - pom.xml
      - src/main/**
      - src/test/java/io/github/janglada/orkit/examples/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: write   # push the built site to gh-pages

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Javadoc for the public packages + mkdocs build --strict (fails on broken links).
      - name: Build docs
        run: docs/build.sh

      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .venv-docs/bin/mkdocs gh-deploy --force --no-history --strict
